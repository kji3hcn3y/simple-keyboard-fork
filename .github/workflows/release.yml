name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/*.apk release-apk/simple-keyboard-fork-${{ github.ref_name }}.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Simple Keyboard Fork ${{ github.ref_name }}
          body: |
            ## Simple Keyboard Fork ${{ github.ref_name }}
            
            ### Fork Changes:
            - **Word suggestions / Подсказки слов:** zero-heap быстрое автодополнение (150K слов для русского и английского языков).
            - **Space swipe language switch / Смена языка свайпом по пробелу:** свайп влево/вправо по пробелу переключает язык с виброоткликом.
            - **Animations & ripple / Анимации и ripple-эффект:** тактильные анимации нажатия клавиш, пробела и ripple-эффект.
            - **Default languages / Языки по умолчанию:** English + Russian включены сразу при установке.
            - **Tablet layout / Планшетная разметка:** полноразмерный цифровой ряд и кнопка настроек на планшетах.
            - **Changed defaults / Настройки по умолчанию:** цифровой ряд включён, системная тема с рамками клавиш, кнопка смены языка скрыта в пользу свайпа.
            - **Edge-to-Edge & Navigation bar:** поддержка окрашивания нижней панели и свободного отступа в цвет темы клавиатуры.
          files: release-apk/simple-keyboard-fork-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
