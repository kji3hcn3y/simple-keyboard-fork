name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build APK
        run: gradle assembleRelease

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/*.apk release-apk/simple-keyboard-fork-v6.8.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v6.8' }}
          name: Simple Keyboard Fork ${{ github.ref_type == 'tag' && github.ref_name || 'v6.8' }}
          body: |
            ## Simple Keyboard Fork Release
            
            ### Fork Changes:
            - **Space swipe language switch / Смена языка свайпом по пробелу:** свайп влево/вправо по пробелу переключает язык с виброоткликом.
            - **Animations & ripple / Анимации и ripple-эффект:** тактильные анимации нажатия клавиш, пробела и ripple-эффект.
            - **Default languages / Языки по умолчанию:** English + Russian включены сразу при установке.
            - **Changed defaults / Настройки по умолчанию:** цифровой ряд включён, системная тема с рамками клавиш, кнопка смены языка скрыта в пользу свайпа.
            - **Launcher icon hidden:** доступ к настройкам через системное меню «Язык и ввод».
          files: release-apk/simple-keyboard-fork-v6.8.apk
          draft: false
          prerelease: false
